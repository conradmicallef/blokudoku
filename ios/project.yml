name: Blokudoku
options:
  bundleIdPrefix: com.conradmicallef
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Blokudoku:
    type: application
    platform: iOS
    sources:
      - Blokudoku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conradmicallef.blokudoku
        DEVELOPMENT_TEAM: 5PW663N3RU
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Blokudoku
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  BlokudokuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BlokudokuTests
    dependencies:
      - target: Blokudoku
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.conradmicallef.blokudoku.tests
schemes:
  Blokudoku:
    build:
      targets:
        Blokudoku: all
    test:
      targets:
        - BlokudokuTests
